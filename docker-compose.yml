services:
  postgres:
    image: postgres:16-alpine
    container_name: vectorly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vectorly
      POSTGRES_PASSWORD: vectorly_secure_db_pass
      POSTGRES_DB: vectorly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectorly -d vectorly"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vectorly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vectorly-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg://vectorly:vectorly_secure_db_pass@postgres:5432/vectorly
      - REDIS_URL=redis://redis:6379/0
      - LLM_PROVIDER=mock
      - LLM_MODEL=local-development
      - JWT_SECRET_KEY=c3629f12089f46bca1387d7f8d68cf6a953a7f80dbca4326b4887342617dfec9
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - TRUSTED_PROXIES=127.0.0.1,::1
      - RATE_LIMIT_ENABLED=true
      - PROMPT_GUARD_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; res = urllib.request.urlopen('http://localhost:8000/health'); exit(0 if res.getcode() == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vectorly-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
